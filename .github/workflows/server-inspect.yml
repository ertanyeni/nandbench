# TEMPORARY diagnostic — is the edited Caddyfile actually what the running
# caddy loaded? Check mounts, in-container file, and live config.
name: Server Inspect

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            echo "=== caddy container mounts ==="
            docker inspect infrastructure-caddy-1 --format '{{range .Mounts}}{{.Source}} -> {{.Destination}} ({{.Type}}){{println}}{{end}}'
            echo "=== does /etc/caddy/Caddyfile inside container have nandbench.com.tr? ==="
            docker exec infrastructure-caddy-1 sh -c 'grep -n "nandbench" /etc/caddy/Caddyfile | grep "{" || echo "NOT FOUND in /etc/caddy/Caddyfile"'
            echo "=== caddy command it was started with ==="
            docker inspect infrastructure-caddy-1 --format '{{.Config.Cmd}} | {{.Path}} {{.Args}}'
            echo "=== live admin config: nandbench.com.tr present? ==="
            docker exec infrastructure-caddy-1 sh -c 'wget -qO- localhost:2019/config/ 2>/dev/null | grep -o "nandbench.com.tr" | head' || echo "(admin query failed / not present)"
            echo "=== host Caddyfile opening lines ==="
            grep -nE '^(www\.|api\.)?nandbench' /home/deploy/infrastructure/Caddyfile | grep '{'
            echo "=== DONE ==="
