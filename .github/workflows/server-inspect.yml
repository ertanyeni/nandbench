# TEMPORARY read-only inspection workflow — used to see how the shared
# Caddy config + docker resources reference the app, so the gatecraft→
# nandbench infra rename can be done safely. Delete after use.
name: Server Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "===== infrastructure dir ====="
            ls -la /home/deploy/infrastructure 2>/dev/null
            echo "===== Caddyfile: nandbench/gatecraft refs ====="
            grep -rn -iE 'gatecraft|nandbench' /home/deploy/infrastructure/ 2>/dev/null
            echo "===== running containers ====="
            docker ps --format '{{.Names}}  ->  {{.Image}}'
            echo "===== volumes (gatecraft/nandbench) ====="
            docker volume ls --format '{{.Name}}' | grep -iE 'gatecraft|nandbench|dist' || true
            echo "===== app deploy dir ====="
            ls -la /home/deploy/gatecraft 2>/dev/null | head
            echo "===== DONE ====="
