# TEMPORARY diagnostic — find why the nandbench.com.tr cert isn't issuing.
name: Server Inspect

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            echo "=== all caddy log lines mentioning nandbench.com.tr (full history in container) ==="
            docker logs infrastructure-caddy-1 2>&1 | grep 'nandbench.com.tr' | tail -50 || echo "(none)"
            echo "=== recent acme / rate / error lines ==="
            docker logs infrastructure-caddy-1 --since 30m 2>&1 | grep -iE 'acme|rate|too many|error|fail|challenge' | tail -40 || echo "(none)"
            echo "=== does the ACME challenge path serve from origin? (self-test on :80) ==="
            curl -s -o /dev/null -w "  acme path HTTP %{http_code}\n" "http://nandbench.com.tr/.well-known/acme-challenge/selftest" || true
            echo "=== existing cert files for the domain on disk ==="
            docker exec infrastructure-caddy-1 sh -c 'find /data -iname "*nandbench.com.tr*" 2>/dev/null | head' || echo "(none / no /data)"
            echo "=== DONE ==="
