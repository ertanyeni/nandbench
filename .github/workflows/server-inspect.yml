# TEMPORARY one-off — restart caddy so it re-binds the updated Caddyfile
# (sed -i changed the inode; the single-file bind mount kept the old one),
# then confirm cert issuance and that other sites are still up.
name: Server Inspect

on:
  workflow_dispatch:

jobs:
  restart-caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            echo "=== restart caddy (re-binds updated Caddyfile) ==="
            docker restart infrastructure-caddy-1
            sleep 8
            echo "=== in-container file now has the new hostnames? ==="
            docker exec infrastructure-caddy-1 grep -n 'nandbench.com.tr' /etc/caddy/Caddyfile | head
            echo "=== wait for ACME issuance ==="
            sleep 30
            echo "=== cert-related logs ==="
            docker logs infrastructure-caddy-1 --since 2m 2>&1 | grep -iE 'nandbench\.com\.tr|obtain|certificate obtained|acme|error' | tail -30 || echo "(none)"
            echo "=== other shared sites still up (from server) ==="
            for h in nandbench.ertanyeni.com favradar.com calofeed.com.tr mysticmind.com.tr; do
              curl -s -o /dev/null -w "  $h -> %{http_code}\n" --max-time 10 "https://$h" || echo "  $h -> ERR"
            done
            echo "=== DONE ==="
