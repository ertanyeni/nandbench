# TEMPORARY one-off — make nandbench.com.tr canonical and 301-redirect the
# old nandbench.ertanyeni.com hostnames to it. Edits the shared Caddyfile
# inode-safely (cat > file, not sed -i) so the running caddy bind mount sees
# the change on reload. Validated before write. Delete after use.
name: Server Inspect

on:
  workflow_dispatch:

jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            echo "===== API .env.production -> .com.tr ====="
            cd /home/deploy/gatecraft/infra
            cp .env.production ".env.production.bak.$(date +%s)"
            sed -i 's#^PUBLIC_API_URL=.*#PUBLIC_API_URL=https://api.nandbench.com.tr#' .env.production
            sed -i 's#^PUBLIC_FRONTEND_URL=.*#PUBLIC_FRONTEND_URL=https://nandbench.com.tr#' .env.production
            sed -i 's#^CORS_ORIGINS=.*#CORS_ORIGINS=https://nandbench.com.tr,https://www.nandbench.com.tr#' .env.production
            grep -E '^(PUBLIC_|CORS_)' .env.production
            docker ps -a --format '{{.Names}}' | grep '_gatecraft-api$' | xargs -r docker rm -f || true
            docker compose up -d --force-recreate gatecraft-api
            sleep 5
            docker ps --format '{{.Names}}  {{.Status}}' | grep gatecraft-api || echo "API NOT RUNNING"

            echo "===== Caddy: drop ertanyeni from live blocks + add 301 redirects ====="
            cd /home/deploy/infrastructure
            cp Caddyfile "Caddyfile.bak.canonical_$(date +%s)"
            sed -e 's/^nandbench\.ertanyeni\.com, nandbench\.com\.tr, www\.nandbench\.com\.tr {/nandbench.com.tr, www.nandbench.com.tr {/' -e 's/^api\.nandbench\.ertanyeni\.com, api\.nandbench\.com\.tr {/api.nandbench.com.tr {/' Caddyfile > /tmp/Caddyfile.new
            printf '%s\n' '' '# nandbench.ertanyeni.com -> canonical nandbench.com.tr (301)' 'nandbench.ertanyeni.com {' '    redir https://nandbench.com.tr{uri} permanent' '}' 'api.nandbench.ertanyeni.com {' '    redir https://api.nandbench.com.tr{uri} permanent' '}' >> /tmp/Caddyfile.new
            echo "--- validate new config (one-off container) ---"
            if docker run --rm -v /tmp/Caddyfile.new:/etc/caddy/Caddyfile:ro caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
              cat /tmp/Caddyfile.new > Caddyfile
              docker exec infrastructure-caddy-1 caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
              echo "CADDY RELOADED OK"
            else
              echo "VALIDATE FAILED — Caddyfile left untouched"
              exit 1
            fi
            sleep 3
            echo "--- in-container nandbench blocks now ---"
            docker exec infrastructure-caddy-1 grep -nE 'nandbench' /etc/caddy/Caddyfile | grep -E 'redir|com.tr \{|com \{'
            echo "===== sanity: shared sites ====="
            for h in nandbench.com.tr favradar.com calofeed.com.tr mysticmind.com.tr; do curl -s -o /dev/null -w "  $h -> %{http_code}\n" --max-time 10 "https://$h" || echo "  $h ERR"; done
            echo "===== DONE ====="
