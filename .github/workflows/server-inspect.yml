# TEMPORARY read-only inspection — dump the Caddyfile blocks + API CORS so
# the nandbench.com.tr domain can be wired in safely. Delete after use.
name: Server Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "===== Caddyfile nandbench blocks (lines 135-185) ====="
            sed -n '135,185p' /home/deploy/infrastructure/Caddyfile
            echo "===== exact site-opening lines ====="
            grep -n 'nandbench.ertanyeni.com' /home/deploy/infrastructure/Caddyfile
            echo "===== API .env.production CORS / PUBLIC lines ====="
            grep -nE 'CORS|PUBLIC_FRONTEND|PUBLIC_API' /home/deploy/gatecraft/infra/.env.production 2>/dev/null
            echo "===== caddy container name ====="
            docker ps --format '{{.Names}}' | grep -i caddy
            echo "===== DONE ====="
