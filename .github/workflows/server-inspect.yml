# TEMPORARY one-off — recover gatecraft-api after a failed recreate and
# bring it up cleanly with the new CORS env. Delete after use.
name: Server Inspect

on:
  workflow_dispatch:

jobs:
  fix-api:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/deploy/gatecraft/infra
            echo "=== current gatecraft containers ==="
            docker ps -a --format '{{.Names}}  {{.Status}}' | grep -i gatecraft || echo "none"
            echo "=== remove any stale gatecraft-api (incl temp-renamed) ==="
            docker ps -a --format '{{.Names}}' | grep 'gatecraft-api' | xargs -r docker rm -f || true
            echo "=== recreate gatecraft-api from compose ==="
            docker compose up -d gatecraft-api
            sleep 6
            echo "=== post state ==="
            docker ps --format '{{.Names}}  {{.Status}}' | grep gatecraft-api || echo "STILL NOT RUNNING"
            echo "=== last 20 log lines ==="
            docker logs gatecraft-api --tail 20 2>&1 || true
            echo "=== DONE ==="
