# TEMPORARY one-off — clean up temp-renamed orphan containers left by a
# concurrent deploy + manual recreate, then reconcile to desired state.
name: Server Inspect

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/deploy/gatecraft/infra
            echo "=== before ==="
            docker ps -a --format '{{.Names}}  {{.Status}}' | grep -i gatecraft || echo none
            echo "=== remove temp-renamed orphans (<id>_gatecraft-*) ==="
            docker ps -a --format '{{.Names}}' | grep -E '_gatecraft-(api|build)$' | xargs -r docker rm -f || true
            echo "=== reconcile (no force-recreate) ==="
            docker compose up -d
            sleep 6
            echo "=== after ==="
            docker ps -a --format '{{.Names}}  {{.Status}}' | grep -i gatecraft || echo none
            echo "=== api log tail ==="
            docker logs gatecraft-api --tail 6 2>&1 || true
            echo "=== DONE ==="
