<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f1115" />
    <meta
      name="description"
      content="nandbench — a web-based, real-time digital logic circuit simulator with live debugging, lessons, and Verilog export."
    />
    <title>nandbench — live digital logic simulator</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0f1115;
        color: #e6e6e6;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif;
        overflow: hidden;
        /* Block native pull-to-refresh / over-scroll bounce — they
           conflict with the canvas's own pan handler. */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* The canvas owns its own gestures. Disable browser pinch-zoom,
         pull-to-refresh and double-tap-to-zoom on touch. */
      canvas {
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
